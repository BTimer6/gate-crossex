services:
  gate-crossex:
    build: .
    init: true
    read_only: true
    ports:
      - "${GCT_PUBLISH_ADDRESS:-127.0.0.1}:17840:17840"
    environment:
      # The process listens on the container interface. Host publication stays
      # loopback-only unless GCT_PUBLISH_ADDRESS is explicitly changed.
      GCT_HOST: 0.0.0.0
      GCT_FRONTEND_ORIGIN: ${GCT_FRONTEND_ORIGIN:-http://127.0.0.1:17840}
      GCT_FRONTEND_PORT: 17840
      GCT_ALLOWED_HOSTS: ${GCT_ALLOWED_HOSTS:-localhost}
      GCT_ACCESS_PASSWORD: ${GCT_ACCESS_PASSWORD:?Set GCT_ACCESS_PASSWORD in .env before starting Docker}
      GCT_ACCESS_COOKIE_SECURE: ${GCT_ACCESS_COOKIE_SECURE:-0}
      GCT_DISABLE_OS_KEYCHAIN: "1"
      GCT_CREDENTIAL_ENV_PATH: /app/.local-data/credentials.env
    volumes:
      - gate-crossex-data:/app/.local-data
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  gate-crossex-data:
